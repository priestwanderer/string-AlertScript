# Enable as sites-enabled/zz-alertboard.string.ink.conf to preserve the default site.
server {
    listen 80;
    server_name alertboard.string.ink;
    return 308 https://alertboard.string.ink$request_uri;
}

server {
    listen 443 ssl;
    server_name alertboard.string.ink;

    ssl_certificate /etc/nginx/ssl/alertboard.string.ink/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/alertboard.string.ink/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AlertboardTLS:1m;
    ssl_session_timeout 10m;
    server_tokens off;

    access_log /var/log/nginx/alertboard.access.log;
    error_log /var/log/nginx/alertboard.error.log;
    client_max_body_size 1m;

    location / {
        proxy_pass https://127.0.0.1:18443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Keep the existing gateway's Basic authentication in force.
        proxy_set_header Authorization $http_authorization;

        # Trust only the existing local gateway certificate.
        proxy_ssl_trusted_certificate /opt/string-alert-panel/secrets/tls.crt;
        proxy_ssl_name 103.204.174.231;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 1;
        proxy_ssl_protocols TLSv1.2;

        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
    }
}
