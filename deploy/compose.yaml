name: string-alert-panel
services:
  panel:
    image: node:22-alpine
    container_name: string-alert-panel
    working_dir: /app
    user: "1000:1000"
    init: true
    command: ["node", "src/index.js", "--ui"]
    environment:
      NODE_ENV: production
      UI_HOST: 0.0.0.0
      UI_PORT: "8787"
      UI_BASE_PATH: ""
      TZ: Asia/Shanghai
    volumes:
      - ./app/src:/app/src:ro
      - ./app/web:/app/web:ro
      - ./app/package.json:/app/package.json:ro
      - ./secrets/app.env:/app/.env:ro
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/schedule').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
  gateway:
    image: nginx:1.28-alpine
    container_name: string-alert-gateway
    user: "1000:1000"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    depends_on:
      panel:
        condition: service_healthy
    ports:
      - "18443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/panel.htpasswd:/etc/nginx/panel.htpasswd:ro
      - ./secrets/tls.crt:/etc/nginx/tls.crt:ro
      - ./secrets/tls.key:/etc/nginx/tls.key:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:8443/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
